name: Build lightweight v1 classifier artifact

on:
  push:
    branches: [main]
    paths:
      - "model_out/v1/skill_classifier.pt"
      - "model/export_v1_classifier_numpy.py"
      - ".github/workflows/build-v1-numpy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.12.1" "numpy==2.4.6"

      - name: Export v1 classifier
        run: python model/export_v1_classifier_numpy.py

      - name: Commit artifact if changed
        run: |
          if git ls-files --error-unmatch model_out/v1/skill_classifier.npz >/dev/null 2>&1; then
            if git diff --quiet -- model_out/v1/skill_classifier.npz; then
              echo "v1 NumPy artifact is already up to date."
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_out/v1/skill_classifier.npz
          git commit -m "build v1 numpy classifier artifact"
          git push
