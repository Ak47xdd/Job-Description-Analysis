name: Build lightweight v2 SBERT classifier artifact

on:
  push:
    branches: [main]
    paths:
      - "model_out/v2_sentence_transformer/skill_classifier_sbert_v2.pt"
      - "model/prep/v2/label_vocab_v2.json"
      - "model/export_sbert_classifier_numpy.py"
      - "model/model_sbert.py"
      - ".github/workflows/build-v2-sbert-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.1 numpy==2.4.6

      - name: Export and validate v2 artifact
        run: python model/export_sbert_classifier_numpy.py

      - name: Commit synchronized artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_out/v2_sentence_transformer/skill_classifier_sbert_v2.npz model_out/v2_sentence_transformer/model_config.json
          if git diff --cached --quiet; then
            echo "v2 SBERT artifacts are already synchronized."
            exit 0
          fi
          git commit -m "build v2 SBERT inference artifact"
          git push
